name: Release

# Push a version tag to publish a release:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # macOS (Apple silicon) and Linux build on a Mac, which makes the dmg.
  unix:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Set the version from the tag
        run: jq --arg v "${GITHUB_REF_NAME#v}" '.version = $v' mygo.json > mygo.tmp && mv mygo.tmp mygo.json
      - name: Build
        run: go tool mygo build -platform darwin/arm64,linux/amd64
      - name: Build the helpers
        # Those the app sends to computers it opens repositories on over SSH,
        # downloaded from the release and verified with the helper key.
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go run ./internal/tools/helpers -o build/helpers
      - name: Add the install instructions to the disk image
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet ds-store
          PATH="$RUNNER_TEMP/venv/bin:$PATH" .github/dmg/add-readme.sh build/darwin-arm64/*.dmg
      - name: Package
        run: |
          mkdir dist
          # The downloads keep one name in every release, so the site can link
          # to releases/latest/download/<name>.
          cp build/darwin-arm64/*.dmg dist/MyGit-macos-arm64.dmg
          cp build/linux-amd64/*.deb dist/MyGit-linux-amd64.deb
          cp build/linux-amd64/mygit-*.tar.gz dist/MyGit-linux-amd64.tar.gz
          cp build/linux-amd64/install.sh dist/
          cp build/helpers/* dist/
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: unix
          path: dist/

  # Windows builds on Windows, where mygo makes the NSIS installer.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set the version from the tag
        shell: bash
        run: jq --arg v "${GITHUB_REF_NAME#v}" '.version = $v' mygo.json > mygo.tmp && mv mygo.tmp mygo.json
      - name: Build
        shell: bash
        run: go tool mygo build -platform windows/amd64
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp build/windows-amd64/*-setup-*.exe dist/MyGit-windows-amd64-setup.exe
          (cd build/windows-amd64 && 7z a -bd ../../dist/MyGit-windows-amd64.zip MyGit.exe icon.png > /dev/null)
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/

  publish:
    needs: [unix, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # The notes are the version's section of CHANGELOG.md. A pre-release
        # (v0.2.0-rc.1) is marked one, so it never becomes the latest release
        # that the download links follow.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## $VERSION" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* $PRE \
            --repo "$GITHUB_REPOSITORY" \
            --title "MyGit $VERSION" \
            --notes-file notes.md
